<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
<title id="title">How the motion synthesis notebook works</title>
<desc id="desc">An input image and a command are interpreted into a sequence of OpenCV-transformed frames, which are exported as a short MP4 animation and evaluated with image similarity metrics.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#15253a"/></linearGradient>
  <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#47dbcb"/><stop offset="1" stop-color="#7aaefa"/></linearGradient>
</defs>
<rect width="1000" height="260" rx="22" fill="url(#bg)"/>
<text x="38" y="39" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#f4f8ff">From a still image to a short animation</text>
<text x="38" y="62" font-family="Arial,sans-serif" font-size="12" fill="#9db0c8">A simplified view of the runnable notebook workflow</text>
<g font-family="Arial,sans-serif">
  <rect x="40" y="88" width="261" height="127" rx="15" fill="#172b43" stroke="#42617d"/>
  <rect x="57" y="107" width="78" height="85" rx="7" fill="#234361"/>
  <circle cx="112" cy="129" r="9" fill="#e3bf7e"/>
  <path d="M66 177 L91 145 L107 165 L118 153 L128 170 L128 184 L66 184Z" fill="#65c2b8"/>
  <text x="148" y="128" font-size="17" font-weight="700" fill="#ffffff">Start with an image</text>
  <text x="148" y="151" font-size="12" fill="#c9d7e8">JPG or PNG input</text>
  <text x="148" y="169" font-size="12" fill="#c9d7e8">loaded with Python</text>
  <path d="M311 151 H354" stroke="url(#cyan)" stroke-width="3" stroke-linecap="round"/><path d="M346 143 L355 151 L346 159" stroke="#70d7d5" stroke-width="3" fill="none"/>
  <rect x="366" y="88" width="260" height="127" rx="15" fill="#172b43" stroke="#42617d"/>
  <rect x="382" y="108" width="227" height="29" rx="7" fill="#0c1829"/>
  <text x="393" y="128" font-size="12" font-family="monospace" fill="#87e6d9">zoom frames 10 fps 10</text>
  <text x="385" y="163" font-size="16" font-weight="700" fill="#ffffff">Choose an effect</text>
  <text x="385" y="184" font-size="12" fill="#c9d7e8">Zoom · rotate · Gaussian blur</text>
  <path d="M637 151 H680" stroke="url(#cyan)" stroke-width="3" stroke-linecap="round"/><path d="M672 143 L681 151 L672 159" stroke="#70d7d5" stroke-width="3" fill="none"/>
  <rect x="692" y="88" width="267" height="127" rx="15" fill="#172b43" stroke="#42617d"/>
  <rect x="710" y="107" width="58" height="75" rx="7" fill="#274363" stroke="#5d84aa"/>
  <rect x="720" y="114" width="58" height="75" rx="7" fill="#365674" stroke="#6994b1"/>
  <rect x="730" y="121" width="58" height="75" rx="7" fill="#457b8a" stroke="#7cb0bd"/>
  <path d="M750 142 L750 171 L772 156Z" fill="#e6faff"/>
  <text x="805" y="133" font-size="17" font-weight="700" fill="#ffffff">Export a video</text>
  <text x="805" y="154" font-size="12" fill="#c9d7e8">MP4 + frame plots</text>
  <text x="805" y="174" font-size="12" fill="#c9d7e8">PSNR / SSIM checks</text>
</g>
<text x="40" y="244" font-family="Arial,sans-serif" font-size="11" fill="#90a6bf">Illustration of the workflow; not a screenshot of a generated frame.</text>
</svg>